<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Your Download · Level 3 Media</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4f1ea;font:15px/1.5 Inter,system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center;padding:20px}.card{width:min(580px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:26px}.brand{font-size:11px;letter-spacing:.14em;font-weight:800;color:#999}h1{font-size:38px;letter-spacing:-.04em;margin:10px 0}p{color:#aaa}.status{padding:12px;border:1px solid #333;border-radius:12px;margin:18px 0}button,a.btn{display:inline-flex;text-decoration:none;border:0;border-radius:12px;padding:13px 18px;background:#fff;color:#000;font-weight:800;cursor:pointer}.ghost{background:#181818!important;color:#fff!important;border:1px solid #333!important}.row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.bad{color:#ff9a9a}</style></head><body><main class="card"><div class="brand">LEVEL 3 MEDIA · DIGITAL DELIVERY</div><h1 id="title">Checking your payment…</h1><p id="copy">Your download is unlocked only after Stripe confirms payment.</p><div id="status" class="status">Verifying order…</div><div class="row"><button id="download" class="hidden">Download file</button><button id="refresh" class="ghost hidden">Refresh secure link</button><a class="btn ghost" href="./shop.html">Back to store</a></div></main><script>const SB='https://zmnhbrjyhxzhkxmhkexs.supabase.co',KEY='sb_publishable_kr5NujBZ1n518IUMDoa2dQ_tqQAJef4';let current=null,consuming=false;const $=s=>document.querySelector(s);async function call(body){const r=await fetch(SB+'/functions/v1/l3-download',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.error){const e=new Error(d.error||'download_failed');e.status=r.status;throw e}return d}function readyLegacy(d){current={mode:'legacy',...d};$('#title').textContent=d.title||'Your download is ready';$('#copy').textContent='Your secure file link expires in about 5 minutes.';$('#status').classList.remove('bad');$('#status').textContent=(d.file_name||'Product file')+' · secure delivery ready';$('#download').classList.remove('hidden');$('#refresh').classList.remove('hidden')}function readyToken(d){current={mode:'token',token:d.download_token,title:d.title,file_name:d.file_name,version:d.version};$('#title').textContent=d.title||'Your download is ready';$('#copy').textContent='Payment confirmed. Your one-time delivery token stays only in this page and expires shortly.';$('#status').classList.remove('bad');$('#status').textContent=(d.file_name||'Product file')+' · click Download file to consume the one-time token';$('#download').classList.remove('hidden');$('#refresh').classList.add('hidden')}async function getLink(){const sid=new URLSearchParams(location.search).get('session_id');if(!sid){$('#title').textContent='Order link missing';$('#status').textContent='This page needs the Checkout session from your completed purchase.';$('#status').classList.add('bad');return}$('#status').classList.remove('bad');$('#status').textContent='Verifying payment and preparing private delivery…';$('#download').classList.add('hidden');$('#refresh').classList.add('hidden');current=null;try{const d=await call({session_id:sid});if(d.download_token)return readyToken(d);if(d.url)return readyLegacy(d);throw new Error('download_contract_invalid')}catch(e){$('#title').textContent='Download not available';$('#status').classList.add('bad');$('#status').textContent=e.message==='payment_not_complete'?'Payment has not completed yet. Wait a moment and try again.':e.message==='download_revoked'?'This download entitlement has been revoked. Contact Level 3 Media if you believe this is an error.':e.message==='session_already_exchanged'?'This paid session has already issued its one-time download token. If the token expired before you used it, contact Level 3 Media for a replacement entitlement.':'We could not prepare the download yet. Try again in a moment.';if(e.message!=='session_already_exchanged')$('#refresh').classList.remove('hidden')}}async function download(){if(!current||consuming)return;if(current.mode==='legacy'&&current.url){location.href=current.url;return}if(current.mode!=='token'||!current.token)return;consuming=true;$('#download').disabled=true;$('#status').textContent='Preparing your single-use secure file link…';try{const d=await call({download_token:current.token});current={mode:'consumed',...d};$('#status').textContent=(d.file_name||'Product file')+' · starting download';location.href=d.url}catch(e){$('#status').classList.add('bad');$('#status').textContent=e.message==='download_token_invalid'||e.message==='download_token_used'?'This one-time download token is expired or already used. Contact Level 3 Media if the download did not complete.':'Secure delivery could not be prepared.'}finally{consuming=false;$('#download').disabled=false}}$('#download').onclick=download;$('#refresh').onclick=getLink;getLink();</script></body></html>
