<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
<meta name="description" content="Book a shoot with Level 3 Media."/>
<meta name="theme-color" content="#050505"/>
<title>Book a Shoot | LEVEL 3 MEDIA</title>
<link rel="canonical" href="https://mcclusterishere.github.io/Lvl-3-Media/book.html"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#050505',surface:'#0c0c0c',raised:'#121212',line:'#1f1f1f',mute:'#6b6b6b',soft:'#a3a3a3'},fontFamily:{sans:['Inter','system-ui','sans-serif'],serif:['Instrument Serif','Georgia','serif']}}}}</script>
<style>
:root{color-scheme:dark}body{background:#050505;-webkit-font-smoothing:antialiased}
.msg-studio{background:#141414;border:1px solid #222;border-radius:18px 18px 18px 4px}
.msg-user{background:#fff;color:#000;border-radius:18px 18px 4px 18px}
.chip{transition:all .2s ease}.chip:active{transform:scale(.97)}.chip:hover{border-color:#555;background:#1a1a1a}
.typing span{display:inline-block;width:6px;height:6px;background:#666;border-radius:50%;margin:0 2px;animation:bounce 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#chat-scroll{scrollbar-width:thin;scrollbar-color:#333 transparent}
input:focus,textarea:focus{outline:none;border-color:#fff}
.fade-in{animation:fadeIn .35s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="font-sans text-white antialiased bg-void h-[100dvh] flex flex-col overflow-hidden">
<header class="flex-shrink-0 border-b border-white/[0.06] px-4 sm:px-6 h-14 flex items-center justify-between bg-void/90 backdrop-blur-md z-20">
<a href="./" class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full border border-white/70 flex items-center justify-center"><div class="flex flex-col gap-[2.5px]"><span class="block w-3.5 h-[1.5px] bg-white"></span><span class="block w-3.5 h-[1.5px] bg-white"></span><span class="block w-3.5 h-[1.5px] bg-white"></span></div></div>
<div><p class="text-[13px] font-medium tracking-[0.12em] uppercase leading-none">Level 3 Media</p><p class="text-[11px] text-mute mt-0.5" id="status-line">Usually replies within a few hours</p></div>
</a>
<a href="./" class="text-[12px] text-mute hover:text-white transition">Site</a>
</header>
<div id="chat-scroll" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4"></div>
<div id="input-area" class="flex-shrink-0 border-t border-white/[0.06] bg-void/95 backdrop-blur-md px-4 sm:px-6 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]"></div>
<script>
const ACCESS_KEY='YOUR_WEB3FORMS_ACCESS_KEY';
const SESSION_KEY='l3_chat_session';
const state={phase:'intake',data:{project_type:'',budget:'',timeline:'',details:'',name:'',phone:'',email:'',source:'Chat Booking Page'},messages:[]};
const chatScroll=document.getElementById('chat-scroll');
const inputArea=document.getElementById('input-area');
const statusLine=document.getElementById('status-line');
function scrollToBottom(){requestAnimationFrame(()=>{chatScroll.scrollTop=chatScroll.scrollHeight})}
function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify({data:state.data,phase:state.phase,messages:state.messages,updated:Date.now()}))}catch(e){}}
function loadSession(){try{const raw=localStorage.getItem(SESSION_KEY);if(!raw)return false;const s=JSON.parse(raw);if(!s||!s.phase)return false;state.data=s.data||state.data;state.phase=s.phase;state.messages=s.messages||[];return true}catch(e){return false}}
function pushLeadToInbox(){try{const leads=JSON.parse(localStorage.getItem('l3_leads')||'[]');const lead={id:'L'+Date.now(),...state.data,messages:state.messages.slice(),created:new Date().toISOString(),status:'new'};leads.unshift(lead);localStorage.setItem('l3_leads',JSON.stringify(leads.slice(0,100)))}catch(e){}}
function addStudio(html,delay=0){return new Promise(resolve=>{setTimeout(()=>{const typing=document.createElement('div');typing.className='flex items-end gap-2.5 fade-in';typing.innerHTML=`<div class="w-7 h-7 rounded-full border border-white/25 flex items-center justify-center flex-shrink-0"><div class="flex flex-col gap-[1.5px]"><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span></div></div><div class="msg-studio px-4 py-3 text-[14px] text-soft"><div class="typing"><span></span><span></span><span></span></div></div>`;chatScroll.appendChild(typing);scrollToBottom();setTimeout(()=>{typing.remove();const el=document.createElement('div');el.className='flex items-end gap-2.5 fade-in';el.innerHTML=`<div class="w-7 h-7 rounded-full border border-white/25 flex items-center justify-center flex-shrink-0"><div class="flex flex-col gap-[1.5px]"><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span></div></div><div class="msg-studio px-4 py-3 text-[14.5px] text-soft max-w-[85%] leading-relaxed">${html}</div>`;chatScroll.appendChild(el);state.messages.push({role:'studio',html,at:Date.now()});saveSession();scrollToBottom();resolve()},650+Math.random()*350)},delay)})}
function addUser(text){const el=document.createElement('div');el.className='flex justify-end fade-in';el.innerHTML=`<div class="msg-user px-4 py-3 text-[14.5px] font-medium max-w-[80%] leading-relaxed">${escapeHtml(text)}</div>`;chatScroll.appendChild(el);state.messages.push({role:'user',text,at:Date.now()});saveSession();scrollToBottom()}
function escapeHtml(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function clearInput(){inputArea.innerHTML=''}
function showChips(options,onSelect){clearInput();const wrap=document.createElement('div');wrap.className='flex flex-wrap gap-2 fade-in';options.forEach(opt=>{const btn=document.createElement('button');btn.type='button';btn.className='chip px-4 py-2.5 rounded-full border border-white/15 text-[13.5px] font-medium text-soft hover:text-white';btn.textContent=opt.label;btn.onclick=()=>onSelect(opt);wrap.appendChild(btn)});inputArea.appendChild(wrap)}
function showTextInput(placeholder,multiline,onSubmit){clearInput();const form=document.createElement('form');form.className='flex gap-2 fade-in';form.onsubmit=(e)=>{e.preventDefault();const val=input.value.trim();if(!val)return;onSubmit(val)};let input;if(multiline){input=document.createElement('textarea');input.rows=2;input.className='flex-1 px-4 py-3 rounded-2xl bg-raised border border-line text-[15px] text-white placeholder-mute resize-none'}else{input=document.createElement('input');input.type='text';input.className='flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute'}input.placeholder=placeholder;input.autocomplete='off';input.required=true;const btn=document.createElement('button');btn.type='submit';btn.className='w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0';btn.innerHTML=`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;form.appendChild(input);form.appendChild(btn);inputArea.appendChild(form);setTimeout(()=>input.focus(),50)}
function showPhoneInput(onSubmit){showTextInput('Your phone number',false,onSubmit);const input=inputArea.querySelector('input');if(input)input.type='tel'}
function showEmailInput(onSubmit){clearInput();const form=document.createElement('form');form.className='flex gap-2 fade-in';form.onsubmit=(e)=>{e.preventDefault();const val=input.value.trim();if(!val||!val.includes('@'))return;onSubmit(val)};const input=document.createElement('input');input.type='email';input.placeholder='you@email.com';input.className='flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute';input.required=true;const btn=document.createElement('button');btn.type='submit';btn.className='w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0';btn.innerHTML=`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;form.appendChild(input);form.appendChild(btn);inputArea.appendChild(form);setTimeout(()=>input.focus(),50)}
function showLiveComposer(){clearInput();statusLine.textContent='Chat open with the studio';const form=document.createElement('form');form.className='flex gap-2 fade-in';form.onsubmit=async(e)=>{e.preventDefault();const val=input.value.trim();if(!val)return;input.value='';addUser(val);appendMessageToLead(val);await notifyFollowUp(val);await addStudio(`Got it. We'll follow up on that shortly.`)};const input=document.createElement('input');input.type='text';input.placeholder='Message the studio...';input.className='flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute';const btn=document.createElement('button');btn.type='submit';btn.className='w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0';btn.innerHTML=`<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;form.appendChild(input);form.appendChild(btn);inputArea.appendChild(form);setTimeout(()=>input.focus(),50)}
function appendMessageToLead(text){try{const leads=JSON.parse(localStorage.getItem('l3_leads')||'[]');if(!leads.length)return;if(leads[0].email===state.data.email||leads[0].phone===state.data.phone){leads[0].messages=leads[0].messages||[];leads[0].messages.push({role:'user',text,at:Date.now()});leads[0].updated=new Date().toISOString();localStorage.setItem('l3_leads',JSON.stringify(leads))}}catch(e){}}
async function notifyFollowUp(text){if(ACCESS_KEY==='YOUR_WEB3FORMS_ACCESS_KEY')return;try{const formData=new FormData();formData.append('access_key',ACCESS_KEY);formData.append('subject',`Chat follow-up from ${state.data.name||'client'}`);formData.append('from_name','Level 3 Media Chat');formData.append('name',state.data.name);formData.append('email',state.data.email);formData.append('phone',state.data.phone);formData.append('message',text);formData.append('project_type',state.data.project_type);await fetch('https://api.web3forms.com/submit',{method:'POST',body:formData})}catch(e){}}
async function start(){await addStudio(`Hey - welcome to <strong class="text-white">Level 3 Media</strong>.<br>I'm going to ask a few quick questions so we can lock in the right shoot for you.`);await addStudio(`First up - what are we working on?`,200);showChips([{label:'Music Video',value:'Music Video'},{label:'Photography / Stills',value:'Photography / Stills'},{label:'Studio Session',value:'Studio Session'},{label:'Video Edit Only',value:'Video Edit Only'},{label:'Trailer / Promo',value:'Trailer / Promo'},{label:'Full Production',value:'Full Production'},{label:'Something else',value:'Other'}],async(opt)=>{state.data.project_type=opt.value;addUser(opt.label);clearInput();await askBudget()})}
async function askBudget(){await addStudio(`Got it. What's the budget range for this?`);showChips([{label:'Under $500',value:'Under $500'},{label:'$500 - $1,000',value:'$500 - $1,000'},{label:'$1,000 - $2,500',value:'$1,000 - $2,500'},{label:'$2,500 - $5,000',value:'$2,500 - $5,000'},{label:'$5,000+',value:'$5,000+'},{label:'Flexible / need a quote',value:'Flexible / Need Quote'}],async(opt)=>{state.data.budget=opt.value;addUser(opt.label);clearInput();await askTimeline()})}
async function askTimeline(){await addStudio(`When are you looking to shoot?`);showChips([{label:'ASAP',value:'ASAP'},{label:'This week',value:'This week'},{label:'Next 2 weeks',value:'Next 2 weeks'},{label:'This month',value:'This month'},{label:'Flexible',value:'Flexible'}],async(opt)=>{state.data.timeline=opt.value;addUser(opt.label);clearInput();await askDetails()})}
async function askDetails(){await addStudio(`Tell me about the project: artist name, song title, vibe, locations, any references. The more detail the better.`);showTextInput('Type your answer...',true,async(val)=>{state.data.details=val;addUser(val);clearInput();await askName()})}
async function askName(){await addStudio(`Perfect. What's your name?`);showTextInput('Your name',false,async(val)=>{state.data.name=val;addUser(val);clearInput();await askPhone()})}
async function askPhone(){await addStudio(`And the best number to reach you on?`);showPhoneInput(async(val)=>{state.data.phone=val;addUser(val);clearInput();await askEmail()})}
async function askEmail(){await addStudio(`Last one - email address so we can send the details.`);showEmailInput(async(val)=>{state.data.email=val;addUser(val);clearInput();await showSummary()})}
async function showSummary(){const d=state.data;await addStudio(`Here's what I've got:<br><br><span class="text-white">Project:</span> ${escapeHtml(d.project_type)}<br><span class="text-white">Budget:</span> ${escapeHtml(d.budget)}<br><span class="text-white">Timeline:</span> ${escapeHtml(d.timeline)}<br><span class="text-white">Name:</span> ${escapeHtml(d.name)}<br><span class="text-white">Phone:</span> ${escapeHtml(d.phone)}<br><span class="text-white">Email:</span> ${escapeHtml(d.email)}<br><br>Ready to send this over?`);showChips([{label:'Yes, send it',value:'yes'},{label:'Start over',value:'restart'}],async(opt)=>{if(opt.value==='restart'){addUser('Start over');clearInput();chatScroll.innerHTML='';state.data={project_type:'',budget:'',timeline:'',details:'',name:'',phone:'',email:'',source:'Chat Booking Page'};state.messages=[];state.phase='intake';saveSession();await start();return}addUser('Yes, send it');clearInput();await submit()})}
async function submit(){await addStudio(`Sending now...`);clearInput();const finishLive=async()=>{state.phase='live';pushLeadToInbox();saveSession();const first=(state.data.name||'there').split(' ')[0];await addStudio(`<strong class="text-white">Got it, ${escapeHtml(first)}.</strong><br><br>Your inquiry is in. You can keep talking right here if you have more details, questions, or references to share. The studio will pick this up and reply.`);showLiveComposer()};if(ACCESS_KEY==='YOUR_WEB3FORMS_ACCESS_KEY'){setTimeout(finishLive,800);return}try{const formData=new FormData();formData.append('access_key',ACCESS_KEY);formData.append('subject',`New Level 3 Media Booking - ${state.data.project_type}`);formData.append('from_name','Level 3 Media Chat');formData.append('name',state.data.name);formData.append('phone',state.data.phone);formData.append('email',state.data.email);formData.append('project_type',state.data.project_type);formData.append('budget',state.data.budget);formData.append('timeline',state.data.timeline);formData.append('details',state.data.details);formData.append('source',state.data.source);const res=await fetch('https://api.web3forms.com/submit',{method:'POST',body:formData});const data=await res.json();if(!data.success)throw new Error('fail');await finishLive()}catch(e){await addStudio(`Something went wrong on our end. You can still leave a message below, or DM on Instagram.`);state.phase='live';pushLeadToInbox();saveSession();showLiveComposer()}}
function restoreLiveUI(){chatScroll.innerHTML='';state.messages.forEach(m=>{if(m.role==='user'){const el=document.createElement('div');el.className='flex justify-end';el.innerHTML=`<div class="msg-user px-4 py-3 text-[14.5px] font-medium max-w-[80%] leading-relaxed">${escapeHtml(m.text||'')}</div>`;chatScroll.appendChild(el)}else{const el=document.createElement('div');el.className='flex items-end gap-2.5';el.innerHTML=`<div class="w-7 h-7 rounded-full border border-white/25 flex items-center justify-center flex-shrink-0"><div class="flex flex-col gap-[1.5px]"><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span><span class="block w-2.5 h-[1px] bg-white/80"></span></div></div><div class="msg-studio px-4 py-3 text-[14.5px] text-soft max-w-[85%] leading-relaxed">${m.html||''}</div>`;chatScroll.appendChild(el)}});scrollToBottom();showLiveComposer()}
if(loadSession()&&state.phase==='live'){restoreLiveUI()}else{start()}
</script>
</body>
</html>
