<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="Book a shoot with Level 3 Media. Music videos, photography & high-end visuals." />
  <meta name="theme-color" content="#050505" />
  <title>Book a Shoot · LEVEL 3 MEDIA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: '#050505',
            surface: '#0c0c0c',
            raised: '#121212',
            line: '#1f1f1f',
            mute: '#6b6b6b',
            soft: '#a3a3a3',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root { color-scheme: dark; }
    body { background: #050505; -webkit-font-smoothing: antialiased; }
    .msg-studio {
      background: #141414;
      border: 1px solid #222;
      border-radius: 18px 18px 18px 4px;
    }
    .msg-user {
      background: #fff;
      color: #000;
      border-radius: 18px 18px 4px 18px;
    }
    .chip {
      transition: all 0.2s ease;
    }
    .chip:active { transform: scale(0.97); }
    .chip:hover { border-color: #555; background: #1a1a1a; }
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #666;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    #chat-scroll {
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    #chat-scroll::-webkit-scrollbar { width: 4px; }
    #chat-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #fff;
    }
    .fade-in {
      animation: fadeIn 0.35s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="font-sans text-white antialiased bg-void h-[100dvh] flex flex-col overflow-hidden">

  <header class="flex-shrink-0 border-b border-white/[0.06] px-4 sm:px-6 h-14 flex items-center justify-between bg-void/90 backdrop-blur-md z-20">
    <a href="/" class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full border border-white/70 flex items-center justify-center">
        <div class="flex flex-col gap-[2.5px]">
          <span class="block w-3.5 h-[1.5px] bg-white"></span>
          <span class="block w-3.5 h-[1.5px] bg-white"></span>
          <span class="block w-3.5 h-[1.5px] bg-white"></span>
        </div>
      </div>
      <div>
        <p class="text-[13px] font-medium tracking-[0.12em] uppercase leading-none">Level 3 Media</p>
        <p class="text-[11px] text-mute mt-0.5">Usually replies within a few hours</p>
      </div>
    </a>
    <a href="/" class="text-[12px] text-mute hover:text-white transition">← Site</a>
  </header>

  <div id="chat-scroll" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4">
  </div>

  <div id="input-area" class="flex-shrink-0 border-t border-white/[0.06] bg-void/95 backdrop-blur-md px-4 sm:px-6 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
  </div>

  <script>
    const ACCESS_KEY = 'YOUR_WEB3FORMS_ACCESS_KEY';

    const state = {
      step: 0,
      data: {
        project_type: '',
        budget: '',
        timeline: '',
        details: '',
        name: '',
        phone: '',
        email: '',
        source: 'Chat Booking Page'
      }
    };

    const chatScroll = document.getElementById('chat-scroll');
    const inputArea = document.getElementById('input-area');

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });
    }

    function addStudio(html, delay = 0) {
      return new Promise(resolve => {
        setTimeout(() => {
          const typing = document.createElement('div');
          typing.className = 'flex items-end gap-2.5 fade-in';
          typing.innerHTML = `
            <div class="w-7 h-7 rounded-full border border-white/25 flex items-center justify-center flex-shrink-0">
              <div class="flex flex-col gap-[1.5px]">
                <span class="block w-2.5 h-[1px] bg-white/80"></span>
                <span class="block w-2.5 h-[1px] bg-white/80"></span>
                <span class="block w-2.5 h-[1px] bg-white/80"></span>
              </div>
            </div>
            <div class="msg-studio px-4 py-3 text-[14px] text-soft">
              <div class="typing"><span></span><span></span><span></span></div>
            </div>`;
          chatScroll.appendChild(typing);
          scrollToBottom();

          setTimeout(() => {
            typing.remove();
            const el = document.createElement('div');
            el.className = 'flex items-end gap-2.5 fade-in';
            el.innerHTML = `
              <div class="w-7 h-7 rounded-full border border-white/25 flex items-center justify-center flex-shrink-0">
                <div class="flex flex-col gap-[1.5px]">
                  <span class="block w-2.5 h-[1px] bg-white/80"></span>
                  <span class="block w-2.5 h-[1px] bg-white/80"></span>
                  <span class="block w-2.5 h-[1px] bg-white/80"></span>
                </div>
              </div>
              <div class="msg-studio px-4 py-3 text-[14.5px] text-soft max-w-[85%] leading-relaxed">${html}</div>`;
            chatScroll.appendChild(el);
            scrollToBottom();
            resolve();
          }, 700 + Math.random() * 400);
        }, delay);
      });
    }

    function addUser(text) {
      const el = document.createElement('div');
      el.className = 'flex justify-end fade-in';
      el.innerHTML = `<div class="msg-user px-4 py-3 text-[14.5px] font-medium max-w-[80%] leading-relaxed">${text}</div>`;
      chatScroll.appendChild(el);
      scrollToBottom();
    }

    function clearInput() {
      inputArea.innerHTML = '';
    }

    function showChips(options, onSelect) {
      clearInput();
      const wrap = document.createElement('div');
      wrap.className = 'flex flex-wrap gap-2 fade-in';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'chip px-4 py-2.5 rounded-full border border-white/15 text-[13.5px] font-medium text-soft hover:text-white';
        btn.textContent = opt.label;
        btn.onclick = () => onSelect(opt);
        wrap.appendChild(btn);
      });
      inputArea.appendChild(wrap);
    }

    function showTextInput(placeholder, multiline = false, onSubmit) {
      clearInput();
      const form = document.createElement('form');
      form.className = 'flex gap-2 fade-in';
      form.onsubmit = (e) => {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;
        onSubmit(val);
      };

      let input;
      if (multiline) {
        input = document.createElement('textarea');
        input.rows = 2;
        input.className = 'flex-1 px-4 py-3 rounded-2xl bg-raised border border-line text-[15px] text-white placeholder-mute resize-none';
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.className = 'flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute';
      }
      input.placeholder = placeholder;
      input.autocomplete = 'off';
      input.required = true;

      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0 hover:bg-neutral-200 transition';
      btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;

      form.appendChild(input);
      form.appendChild(btn);
      inputArea.appendChild(form);
      setTimeout(() => input.focus(), 50);
    }

    function showPhoneInput(onSubmit) {
      clearInput();
      const form = document.createElement('form');
      form.className = 'flex gap-2 fade-in';
      form.onsubmit = (e) => {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;
        onSubmit(val);
      };
      const input = document.createElement('input');
      input.type = 'tel';
      input.placeholder = 'Your phone number';
      input.className = 'flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute';
      input.required = true;
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0';
      btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;
      form.appendChild(input);
      form.appendChild(btn);
      inputArea.appendChild(form);
      setTimeout(() => input.focus(), 50);
    }

    function showEmailInput(onSubmit) {
      clearInput();
      const form = document.createElement('form');
      form.className = 'flex gap-2 fade-in';
      form.onsubmit = (e) => {
        e.preventDefault();
        const val = input.value.trim();
        if (!val || !val.includes('@')) return;
        onSubmit(val);
      };
      const input = document.createElement('input');
      input.type = 'email';
      input.placeholder = 'you@email.com';
      input.className = 'flex-1 px-4 py-3 rounded-full bg-raised border border-line text-[15px] text-white placeholder-mute';
      input.required = true;
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'w-11 h-11 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0';
      btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>`;
      form.appendChild(input);
      form.appendChild(btn);
      inputArea.appendChild(form);
      setTimeout(() => input.focus(), 50);
    }

    async function start() {
      await addStudio(`Hey — welcome to <strong class="text-white">Level 3 Media</strong>.<br>I'm going to ask a few quick questions so we can lock in the right shoot for you.`);
      await addStudio(`First up — what are we working on?`, 200);
      showChips([
        { label: 'Music Video', value: 'Music Video' },
        { label: 'Photography / Stills', value: 'Photography / Stills' },
        { label: 'Studio Session', value: 'Studio Session' },
        { label: 'Video Edit Only', value: 'Video Edit Only' },
        { label: 'Trailer / Promo', value: 'Trailer / Promo' },
        { label: 'Full Production', value: 'Full Production' },
        { label: 'Something else', value: 'Other' }
      ], async (opt) => {
        state.data.project_type = opt.value;
        addUser(opt.label);
        clearInput();
        await askBudget();
      });
    }

    async function askBudget() {
      await addStudio(`Got it. What's the budget range for this?`);
      showChips([
        { label: 'Under $500', value: 'Under $500' },
        { label: '$500 – $1,000', value: '$500 – $1,000' },
        { label: '$1,000 – $2,500', value: '$1,000 – $2,500' },
        { label: '$2,500 – $5,000', value: '$2,500 – $5,000' },
        { label: '$5,000+', value: '$5,000+' },
        { label: 'Flexible / need a quote', value: 'Flexible / Need Quote' }
      ], async (opt) => {
        state.data.budget = opt.value;
        addUser(opt.label);
        clearInput();
        await askTimeline();
      });
    }

    async function askTimeline() {
      await addStudio(`When are you looking to shoot?`);
      showChips([
        { label: 'ASAP', value: 'ASAP' },
        { label: 'This week', value: 'This week' },
        { label: 'Next 2 weeks', value: 'Next 2 weeks' },
        { label: 'This month', value: 'This month' },
        { label: 'Flexible', value: 'Flexible' }
      ], async (opt) => {
        state.data.timeline = opt.value;
        addUser(opt.label);
        clearInput();
        await askDetails();
      });
    }

    async function askDetails() {
      await addStudio(`Tell me about the project — artist name, song title, vibe, locations, any references. The more detail the better.`);
      showTextInput('Type your answer...', true, async (val) => {
        state.data.details = val;
        addUser(val);
        clearInput();
        await askName();
      });
    }

    async function askName() {
      await addStudio(`Perfect. What's your name?`);
      showTextInput('Your name', false, async (val) => {
        state.data.name = val;
        addUser(val);
        clearInput();
        await askPhone();
      });
    }

    async function askPhone() {
      await addStudio(`And the best number to reach you on?`);
      showPhoneInput(async (val) => {
        state.data.phone = val;
        addUser(val);
        clearInput();
        await askEmail();
      });
    }

    async function askEmail() {
      await addStudio(`Last one — email address so we can send the details.`);
      showEmailInput(async (val) => {
        state.data.email = val;
        addUser(val);
        clearInput();
        await showSummary();
      });
    }

    async function showSummary() {
      const d = state.data;
      await addStudio(`
        Here's what I've got:<br><br>
        <span class="text-white">Project:</span> ${d.project_type}<br>
        <span class="text-white">Budget:</span> ${d.budget}<br>
        <span class="text-white">Timeline:</span> ${d.timeline}<br>
        <span class="text-white">Name:</span> ${d.name}<br>
        <span class="text-white">Phone:</span> ${d.phone}<br>
        <span class="text-white">Email:</span> ${d.email}<br><br>
        Ready to send this over?
      `);
      showChips([
        { label: 'Yes, send it', value: 'yes' },
        { label: 'Start over', value: 'restart' }
      ], async (opt) => {
        if (opt.value === 'restart') {
          addUser('Start over');
          clearInput();
          chatScroll.innerHTML = '';
          state.data = { project_type: '', budget: '', timeline: '', details: '', name: '', phone: '', email: '', source: 'Chat Booking Page' };
          await start();
          return;
        }
        addUser('Yes, send it');
        clearInput();
        await submit();
      });
    }

    async function submit() {
      await addStudio(`Sending now...`);
      clearInput();

      if (ACCESS_KEY === 'YOUR_WEB3FORMS_ACCESS_KEY') {
        setTimeout(async () => {
          await addStudio(`
            <strong class="text-white">Got it, ${state.data.name.split(' ')[0]}.</strong><br><br>
            Your inquiry is in. We'll review everything and get back to you shortly with availability and next steps.<br><br>
            In the meantime you can check more work on <a href="https://www.instagram.com/level3mediallc/" target="_blank" class="text-white underline underline-offset-2">Instagram</a>.
          `);
          clearInput();
          const wrap = document.createElement('div');
          wrap.className = 'text-center fade-in';
          wrap.innerHTML = `<a href="/" class="inline-block px-6 py-3 rounded-full border border-white/20 text-[13px] font-medium hover:bg-white/5 transition">Back to site</a>`;
          inputArea.appendChild(wrap);
        }, 900);
        return;
      }

      try {
        const formData = new FormData();
        formData.append('access_key', ACCESS_KEY);
        formData.append('subject', `New Level 3 Media Booking — ${state.data.project_type}`);
        formData.append('from_name', 'Level 3 Media Chat');
        formData.append('name', state.data.name);
        formData.append('phone', state.data.phone);
        formData.append('email', state.data.email);
        formData.append('project_type', state.data.project_type);
        formData.append('budget', state.data.budget);
        formData.append('timeline', state.data.timeline);
        formData.append('details', state.data.details);
        formData.append('source', state.data.source);

        const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          await addStudio(`
            <strong class="text-white">Got it, ${state.data.name.split(' ')[0]}.</strong><br><br>
            Your inquiry just landed. We'll review everything and get back to you shortly with availability and next steps.<br><br>
            In the meantime you can check more work on <a href="https://www.instagram.com/level3mediallc/" target="_blank" class="text-white underline underline-offset-2">Instagram</a>.
          `);
        } else {
          throw new Error('fail');
        }
      } catch (e) {
        await addStudio(`Something went wrong on our end. Mind trying again or just DM us on Instagram?`);
      }
      clearInput();
      const wrap = document.createElement('div');
      wrap.className = 'text-center fade-in';
      wrap.innerHTML = `<a href="/" class="inline-block px-6 py-3 rounded-full border border-white/20 text-[13px] font-medium hover:bg-white/5 transition">Back to site</a>`;
      inputArea.appendChild(wrap);
    }

    start();
  </script>
</body>
</html>
